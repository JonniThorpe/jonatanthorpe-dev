# app.jonatanthorpe.dev — PedidosAutomatizados (Fase 3).
#
# Vhost independiente del portfolio: fichero propio y server_name propio. El
# portfolio se enruta en jonatanthorpe.dev.conf y NO se toca desde aqui.
#
# LA COSTURA: nginx termina TLS y hace proxy_pass al 127.0.0.1:8081, que es
# donde publica el contenedor Caddy de la app (docker-compose.yml del repo
# PedidosAutomatizados, servicio "web"). Caddy reparte por dentro entre
# /api/* y el estatico del frontend. Si cambia ese puerto, hay que cambiarlo
# en los dos sitios.
#
# Estado: TLS ya emitido. Este fichero es el resultado de
#   sudo certbot --nginx -d app.jonatanthorpe.dev
# volcado de vuelta desde el servidor. Las lineas "managed by Certbot" las
# reescribe certbot en cada renovacion: no las edites a mano.
#
# El -d explicito no es opcional: sin el, certbot podria ampliar el
# certificado del portfolio en vez de emitir uno nuevo, y los dos sitios
# quedarian atados al mismo certificado.

server {
    server_name app.jonatanthorpe.dev;

    # Los clientes mandan fotos de los pedidos y Meta entrega adjuntos por el
    # webhook. Con el 1m por defecto de nginx, una foto de movil se rechaza
    # con un 413 antes de llegar a la aplicacion.
    client_max_body_size 25m;

    # Solo tiene efecto sobre https, que es lo unico que quedara tras certbot.
    # Se emite aqui, en quien termina TLS, y no en Caddy: una sola cabecera.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- SSE: el panel en tiempo real ---
    # Va ANTES del location / y es el bloque delicado de toda la config.
    # nginx bufferiza las respuestas por defecto: acumularia los eventos y los
    # entregaria a trozos o al cerrar, con lo que el panel dejaria de
    # actualizarse solo. Y con el proxy_read_timeout por defecto (60s) cortaria
    # la conexion al minuto de silencio, porque un stream inactivo le parece
    # una respuesta colgada.
    location /api/sse/stream {
        proxy_pass http://127.0.0.1:8081;

        # HTTP/1.1 con Connection vacio: sin esto nginx habla HTTP/1.0 con el
        # upstream y no hay streaming que valga.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Todo lo demas: API, webhooks y el estatico del frontend ---
    # El reparto fino lo hace Caddy dentro del contenedor; aqui no se decide
    # nada por ruta. Importante: no se reescribe el cuerpo de las peticiones,
    # porque la firma HMAC del webhook de Meta se calcula sobre los bytes
    # exactos y cualquier modificacion la invalidaria.
    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # De aqui sale el X-Forwarded-Proto: https que Spring Boot necesita
        # (server.forward-headers-strategy=framework) para no generar URLs en
        # http cuando responde al webhook.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.jonatanthorpe.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.jonatanthorpe.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = app.jonatanthorpe.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name app.jonatanthorpe.dev;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}