<title>Peak Network</title>
<style>
  :root { --accent: #f08a4b; --core: #ffe2cc; }
  html, body { margin: 0; height: 100%; background: #0f141c; }
  .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .cable      { fill: none; stroke: var(--accent); stroke-width: 3; stroke-opacity: .28; stroke-linecap: round; }
  .cable-flow { fill: none; stroke: var(--accent); stroke-width: 3; stroke-opacity: .55; stroke-linecap: round;
                stroke-dasharray: 2 26; animation: flow 3.5s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }

  .pulse-glow { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; filter: url(#glow); }
  .pulse-core { fill: none; stroke: var(--core);   stroke-width: 4;  stroke-linecap: round; }

  .node      { fill: var(--accent); }
  .node-core { fill: var(--core); }
  .halo      { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center;
               animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .5; transform: scale(1.6); } }
  .ping { fill: none; stroke: var(--accent); stroke-width: 4; transform-box: fill-box; transform-origin: center; }

  @media (prefers-reduced-motion: reduce) {
    .cable-flow, .halo { animation: none; }
  }
</style>

    <g id="cables"></g>
    <g id="pulses"></g>
    <g id="nodes"></g>
  </svg>
</section>

<script>
(() => {
  // Peak coordinates in image pixels (3840x2560)
  const PEAKS = {
    a: [1041,1066], b: [503,1244],  c: [467,1329],  d: [1920,1075], e: [1642,1175],
    f: [2655,1085], g: [3773,1089], h: [3473,1089], i: [1344,1749], j: [3575,1797],
    k: [2780,1302], l: [3216,1302], m: [2429,1411], n: [1142,1261], o: [3734,1286]
  };
  const EDGES = [
    ['b','c'],['b','a'],['c','n'],['a','n'],['a','d'],['a','e'],['e','d'],['e','n'],
    ['d','f'],['e','m'],['f','k'],['f','h'],['h','g'],['h','l'],['k','l'],['l','o'],
    ['g','o'],['k','m'],['m','i'],['n','i'],['m','j'],['l','j'],['o','j']
  ];
  const SAG = 0.10;           // how much the cables droop (fraction of their length)
  const SPAWN_MS = 420;       // how often a new signal is fired
  const HOP_CHANCE = 0.55;    // chance a signal keeps travelling to a neighbour

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent && parent.appendChild(n);
    return n;
  };

  // A sagging cable between two points, as a quadratic curve
  const curve = (p, q) => {
    const [x1,y1] = p, [x2,y2] = q;
    const len = Math.hypot(x2-x1, y2-y1);
    const cx = (x1+x2)/2, cy = (y1+y2)/2 + len*SAG;
    return `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`;
  };

  const neighbours = {};
  for (const [u,v] of EDGES) {
    (neighbours[u] ||= []).push(v);
    (neighbours[v] ||= []).push(u);
    el('path', { d: curve(PEAKS[u], PEAKS[v]), class: 'cable' }, $('cables'));
    el('path', { d: curve(PEAKS[u], PEAKS[v]), class: 'cable-flow' }, $('cables'));
  }

  const nodeEls = {};
  for (const id in PEAKS) {
    const [x,y] = PEAKS[id];
    const g = el('g', {}, $('nodes'));
    const halo = el('circle', { cx:x, cy:y, r:18, class:'halo' }, g);
    halo.style.animationDelay = `${-Math.random()*3.2}s`;
    el('circle', { cx:x, cy:y, r:10, class:'node' }, g);
    el('circle', { cx:x, cy:y, r:4,  class:'node-core' }, g);
    nodeEls[id] = g;
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Ring that expands when a signal arrives at a peak
  const ping = id => {
    const [x,y] = PEAKS[id];
    const c = el('circle', { cx:x, cy:y, r:14, class:'ping' }, nodeEls[id]);
    c.animate([{ transform:'scale(1)', opacity:.9 }, { transform:'scale(4)', opacity:0 }],
              { duration: 900, easing: 'ease-out' }).onfinish = () => c.remove();
  };

  // A glowing streak travelling from one peak to another
  const send = (from, to, hops = 0) => {
    const d = curve(PEAKS[from], PEAKS[to]);
    const g = el('g', {}, $('pulses'));
    const glow = el('path', { d, class:'pulse-glow' }, g);
    const core = el('path', { d, class:'pulse-core' }, g);
    const L = core.getTotalLength();
    const seg = Math.min(220, L*0.35);
    const duration = 700 + L*1.1;
    for (const p of [glow, core]) {
      p.style.strokeDasharray = `${seg} ${L + seg}`;
      p.animate([{ strokeDashoffset: seg }, { strokeDashoffset: -L }],
                { duration, easing: 'cubic-bezier(.45,.05,.55,.95)', fill: 'forwards' });
    }
    setTimeout(() => {
      g.remove();
      ping(to);
      if (hops < 4 && Math.random() < HOP_CHANCE) {
        const next = neighbours[to].filter(n => n !== from);
        if (next.length) send(to, next[Math.floor(Math.random()*next.length)], hops + 1);
      }
    }, duration);
  };

  const ids = Object.keys(PEAKS);
  const fire = () => {
    if (document.hidden) return;
    const from = ids[Math.floor(Math.random()*ids.length)];
    const nb = neighbours[from];
    send(from, nb[Math.floor(Math.random()*nb.length)]);
  };
  setInterval(fire, SPAWN_MS);
  fire(); fire();
})();
</script>
