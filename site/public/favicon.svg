<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JT">
  <style>
    /* Follows the site palette; swaps the tile to the dark-theme accent
       in dark UIs (supported by modern browsers). */
    .bg { fill: #2B4C43; }
    @media (prefers-color-scheme: dark) { .bg { fill: #4C8577; } }
  </style>
  <rect class="bg" width="64" height="64" rx="14" />
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="'Sora', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.5" fill="#FAFAF8">JT</text>
</svg>
